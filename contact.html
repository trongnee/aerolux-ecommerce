<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ — AEROLUX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="main-content">
    <div class="page-header"><div class="container"><h1>Liên hệ</h1></div></div>
    <div class="container contact-layout">
      <div>
        <div class="contact-info-item">
          <div class="contact-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
          <div><strong>Địa chỉ</strong><p>123 Nguyễn Huệ, Quận 1, TP. Hồ Chí Minh</p></div>
        </div>
        <div class="contact-info-item">
          <div class="contact-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
          <div><strong>Hotline</strong><p>1900 1234</p></div>
        </div>
        <div class="contact-info-item">
          <div class="contact-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
          <div><strong>Email</strong><p>support@aerolux.vn</p></div>
        </div>
      </div>
      <form id="contact-form" onsubmit="event.preventDefault();Toast.success('Cảm ơn bạn đã liên hệ! Chúng tôi sẽ phản hồi sớm.');this.reset();">
        <div class="form-group"><label>Họ tên</label><input type="text" required></div>
        <div class="form-group"><label>Email</label><input type="email" required></div>
        <div class="form-group"><label>Số điện thoại</label><input type="tel"></div>
        <div class="form-group"><label>Nội dung</label><textarea rows="4" required></textarea></div>
        <button type="submit" class="btn btn-primary">Gửi tin nhắn</button>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/data/categories.js"></script>
  <script src="assets/js/data/brands.js"></script>
  <script src="assets/js/data/products.js"></script>
  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/storage.js"></script>
  <script src="assets/js/core/product-service.js"></script>
  <script src="assets/js/core/cart-service.js"></script>
  <script src="assets/js/components/toast.js"></script>
  <script src="assets/js/components/product-card.js"></script>
  <script src="assets/js/components/header.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initHeaderFooter);</script>
</body>
</html>
