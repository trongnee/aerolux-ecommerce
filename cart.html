<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng — AEROLUX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="main-content">
    <div class="page-header">
      <div class="container"><h1>Giỏ hàng</h1></div>
    </div>
    <div class="container">
      <div id="cart-empty" class="empty-state" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <h3>Giỏ hàng trống</h3>
        <p>Hãy khám phá sản phẩm và thêm vào giỏ hàng</p>
        <a href="index.html" class="btn btn-primary">Tiếp tục mua sắm</a>
      </div>
      <div class="cart-layout" id="cart-layout">
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-summary">
          <h3>Tóm tắt đơn hàng</h3>
          <div class="coupon-form">
            <input type="text" id="coupon-input" placeholder="Mã giảm giá">
            <button class="btn btn-secondary btn-sm" id="apply-coupon">Áp dụng</button>
          </div>
          <p style="font-size:0.75rem;color:var(--color-text-muted);margin-bottom:1rem">Thử: AEROLUX10, AEROLUX50K, FREESHIP</p>
          <div class="cart-summary-row"><span>Tạm tính</span><span id="summary-subtotal">0₫</span></div>
          <div class="cart-summary-row"><span>Giảm giá</span><span id="summary-discount">0₫</span></div>
          <div class="cart-summary-row"><span>Phí vận chuyển</span><span id="summary-shipping">0₫</span></div>
          <div class="cart-summary-row total"><span>Tổng cộng</span><span id="summary-total">0₫</span></div>
          <a href="checkout.html" class="btn btn-primary btn-block btn-lg">Thanh toán</a>
          <a href="index.html" class="btn btn-ghost btn-block mt-2">Tiếp tục mua hàng</a>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/data/categories.js"></script>
  <script src="assets/js/data/brands.js"></script>
  <script src="assets/js/data/products.js"></script>
  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/storage.js"></script>
  <script src="assets/js/core/product-service.js"></script>
  <script src="assets/js/core/cart-service.js"></script>
  <script src="assets/js/components/toast.js"></script>
  <script src="assets/js/components/product-card.js"></script>
  <script src="assets/js/components/header.js"></script>
  <script src="assets/js/pages/cart.js"></script>
</body>
</html>
